<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TutorLink 📚</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Welcome -->
  <section id="welcome" class="screen active">
    <div class="card fade-in">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Welcome" class="hero-img">
      <h1>Welcome to <span class="highlight">TutorLink</span></h1>
      <p>Find the perfect tutor or share your expertise — anytime, anywhere.</p>
      <button onclick="nextStep('signin')">Let’s Get Started 🚀</button>
    </div>
  </section>

  <!-- Sign-In -->
  <section id="signin" class="screen hidden">
    <div class="card fade-in">
      <h2>Sign In or Create Account</h2>
      <button class="facebook">Continue with Facebook</button>
      <button class="email" onclick="nextStep('email')">Continue with Email / Number</button>
    </div>
  </section>

  <!-- Email / Number -->
  <section id="email" class="screen hidden">
    <div class="card fade-in">
      <h2>Enter Your Details</h2>
      <input type="text" placeholder="Email or Phone Number">
      <button onclick="nextStep('survey')">Continue</button>
    </div>
  </section>

  <!-- Survey -->
  <section id="survey" class="screen hidden">
    <div class="card fade-in">
      <h2>Tell us who you are</h2>
      <p>Select your role:</p>
      <div class="choice-buttons">
        <button onclick="selectRole('student')">🎓 I’m a Student</button>
        <button onclick="selectRole('teacher')">👩‍🏫 I’m a Teacher</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
